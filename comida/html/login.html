<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - FoodShop</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        main { box-sizing: border-box; max-width: 420px; margin: 60px auto; padding: 28px; background: white; border-radius: 10px; }
        h1 { color: #ff5722; text-align: center; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input { box-sizing: border-box; width: 100%; padding: 11px; margin-top: 6px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 5px; background: #ff5722; color: white; font-size: 16px; cursor: pointer; }
        .error { color: #b71c1c; }
        .volver { display: block; margin-top: 18px; text-align: center; }
    </style>
</head>
<body>
    <main>
        <h1>Iniciar sesión</h1>
        {% if form.non_field_errors %}
            <p class="error" role="alert">{{ form.non_field_errors }}</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <label for="id_username">Usuario</label>
            <input id="id_username" type="text" name="username" autocomplete="username" required>
            {% for error in form.username.errors %}<p class="error">{{ error }}</p>{% endfor %}
            <label for="id_password">Contraseña</label>
            <input id="id_password" type="password" name="password" autocomplete="current-password" required>
            {% for error in form.password.errors %}<p class="error">{{ error }}</p>{% endfor %}
            <button type="submit">Entrar</button>
        </form>
        <a class="volver" href="{% url 'inicio' %}">Volver al inicio</a>
    </main>
</body>
</html>
